<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guild Roster - Azeroth</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #1a1a2e;
    color: #e0d8c8;
    font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
    min-height: 100vh;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
}

nav {
    text-align: right;
    padding: 8px 0;
}

nav a {
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    margin-left: 16px;
}

.header {
    text-align: center;
    padding: 24px 0 16px;
    border-bottom: 2px solid #c9aa71;
    margin-bottom: 24px;
}

.header h1 {
    color: #ffd100;
    font-size: 28px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4px;
}

.header h2 {
    color: #c9aa71;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 400;
}

.section {
    background: #16213e;
    border: 1px solid #c9aa71;
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 0 10px rgba(201, 170, 113, 0.1);
}

.section-title {
    color: #ffd100;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    border-bottom: 1px solid #3d3d5c;
    padding-bottom: 8px;
    margin-bottom: 12px;
}

/* Buff coverage */
.buff-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
}

.buff-tag {
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 600;
    background: #1a1a2e;
    border: 1px solid #3d3d5c;
}

.buff-tag.present { border-color: #1eff00; color: #1eff00; }
.buff-tag.missing { border-color: #ff4444; color: #ff4444; opacity: 0.5; }

.buff-tag .count {
    margin-left: 4px;
    opacity: 0.7;
    font-weight: 400;
}

/* Roster table */
.roster-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.roster-table th {
    text-align: left;
    color: #8b8878;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 10px;
    border-bottom: 1px solid #3d3d5c;
}

.roster-table th.center,
.roster-table td.center {
    text-align: center;
}

.roster-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #1f2b47;
    vertical-align: middle;
}

.roster-table tr:hover {
    background: #1f2b47;
}

.roster-table tr.role-header td {
    background: #1a1a2e;
    color: #c9aa71;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px;
    border-bottom: 1px solid #3d3d5c;
}

.bot-name {
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
}

.bot-name:hover {
    opacity: 0.8;
    text-decoration: underline;
}

.spec-cell {
    display: flex;
    align-items: center;
    gap: 6px;
}

.spec-select, .role-select {
    background: #1a1a2e;
    color: #e0d8c8;
    border: 1px solid #3d3d5c;
    border-radius: 3px;
    padding: 3px 6px;
    font-size: 12px;
    cursor: pointer;
}

.spec-select:focus, .role-select:focus {
    border-color: #c9aa71;
    outline: none;
}

input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: #c9aa71;
}

.gear-score {
    font-weight: 600;
}

.gs-high { color: #a335ee; }
.gs-mid { color: #0070dd; }
.gs-low { color: #1eff00; }

/* Gear detail panel */
.gear-panel {
    display: none;
}

.gear-panel td {
    padding: 0 !important;
    border-bottom: none !important;
}

.gear-panel.open {
    display: table-row;
}

.gear-detail {
    background: #1a1a2e;
    padding: 12px 16px;
    margin: 0 10px 8px 10px;
    border-radius: 4px;
    border: 1px solid #3d3d5c;
}

.gear-detail h4 {
    color: #c9aa71;
    font-size: 12px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.gear-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 20px;
}

.gear-slot {
    font-size: 12px;
    padding: 3px 0;
    display: flex;
    justify-content: space-between;
}

.gear-slot .slot-name {
    color: #6b6860;
    min-width: 80px;
}

.gear-slot .item-level {
    color: #8b8878;
    font-size: 11px;
    margin-left: 8px;
}

.gear-loading {
    color: #6b6860;
    font-style: italic;
    font-size: 12px;
    padding: 8px 0;
}

/* Action bar */
.action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #3d3d5c;
}

.raid-count {
    color: #8b8878;
    font-size: 13px;
}

.raid-count .value {
    color: #ffd100;
    font-weight: 700;
}

.btn {
    padding: 8px 20px;
    border: 1px solid #c9aa71;
    background: #16213e;
    color: #ffd100;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    letter-spacing: 1px;
    transition: background 0.15s;
}

.btn:hover {
    background: #1f2b47;
}

.btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.btn-save {
    background: #2a4a2a;
    border-color: #1eff00;
    color: #1eff00;
}

.btn-save:hover {
    background: #2a5a2a;
}

.save-status {
    font-size: 12px;
    margin-left: 12px;
    transition: opacity 0.3s;
}

.save-status.success { color: #1eff00; }
.save-status.error { color: #ff4444; }

/* Summary stats */
.summary-row {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
}

.summary-stat {
    background: #1a1a2e;
    padding: 10px 16px;
    border-radius: 4px;
    flex: 1;
    text-align: center;
}

.summary-stat .label {
    color: #6b6860;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.summary-stat .value {
    font-size: 20px;
    font-weight: 700;
    color: #ffd100;
}

.empty { color: #4a4a4a; font-style: italic; font-size: 13px; }

@media (max-width: 700px) {
    .summary-row { flex-direction: column; gap: 8px; }
    .gear-grid { grid-template-columns: 1fr; }
    .action-bar { flex-direction: column; gap: 12px; }
}
</style>
</head>
<body>
<div class="container">
    <nav>
        <a href="/" style="color: #c9aa71;">Dashboard</a>
        <a href="/guild" style="color: #ffd100;">Guild Roster</a>
    </nav>
    <div class="header">
        <h1>Azeroth</h1>
        <h2>Guild Roster Editor</h2>
    </div>

    <div class="summary-row" id="summary-row">
        <div class="summary-stat"><div class="label">Total Bots</div><div class="value" id="stat-total">--</div></div>
        <div class="summary-stat"><div class="label">Tanks</div><div class="value" id="stat-tanks">--</div></div>
        <div class="summary-stat"><div class="label">Healers</div><div class="value" id="stat-healers">--</div></div>
        <div class="summary-stat"><div class="label">DPS</div><div class="value" id="stat-dps">--</div></div>
        <div class="summary-stat"><div class="label">Raid Assigned</div><div class="value" id="stat-raid">--</div></div>
    </div>

    <div class="section">
        <div class="section-title">Raid Buff Coverage</div>
        <div class="buff-grid" id="buff-grid">
            <span class="empty">Loading...</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Roster</div>
        <div id="roster-content">
            <div class="empty">Loading roster...</div>
        </div>
        <div class="action-bar">
            <div class="raid-count">Raid slots: <span class="value" id="raid-slot-count">0</span> / 40</div>
            <div>
                <button class="btn btn-save" id="save-btn" onclick="saveRaidPlan()" disabled>Save Raid Plan</button>
                <span class="save-status" id="save-status"></span>
            </div>
        </div>
    </div>
</div>

<script>
let rosterData = [];
let gearCache = {};
let dirty = false;

const CLASS_SPECS = {
    "Warrior": ["Arms", "Fury", "Protection"],
    "Paladin": ["Holy", "Protection", "Retribution"],
    "Hunter": ["Beast Mastery", "Marksmanship", "Survival"],
    "Rogue": ["Assassination", "Combat", "Subtlety"],
    "Priest": ["Discipline", "Holy", "Shadow"],
    "Shaman": ["Elemental", "Enhancement", "Restoration"],
    "Mage": ["Arcane", "Fire", "Frost"],
    "Warlock": ["Affliction", "Demonology", "Destruction"],
    "Druid": ["Balance", "Feral", "Restoration"],
};

const BUFF_MAP = {
    "Warrior": ["Battle Shout", "Sunder Armor"],
    "Paladin": ["Blessings", "Auras"],
    "Hunter": ["Trueshot Aura"],
    "Rogue": ["Expose Armor"],
    "Priest": ["Power Word: Fortitude", "Shadow Prot"],
    "Shaman": ["Totems", "Windfury"],
    "Mage": ["Arcane Intellect"],
    "Warlock": ["Curse of Elements", "Healthstones"],
    "Druid": ["Mark of the Wild", "Innervate"],
};

async function fetchJSON(url) {
    try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(resp.status);
        return await resp.json();
    } catch (e) {
        console.error("Fetch error:", url, e);
        return null;
    }
}

function gsClass(score) {
    if (score >= 60) return "gs-high";
    if (score >= 40) return "gs-mid";
    return "gs-low";
}

function updateSummary() {
    const total = rosterData.length;
    const tanks = rosterData.filter(b => b.role === "tank").length;
    const healers = rosterData.filter(b => b.role === "healer").length;
    const dps = rosterData.filter(b => b.role === "dps").length;
    const raid = rosterData.filter(b => b.raid_assigned).length;

    document.getElementById("stat-total").textContent = total;
    document.getElementById("stat-tanks").textContent = tanks;
    document.getElementById("stat-healers").textContent = healers;
    document.getElementById("stat-dps").textContent = dps;
    document.getElementById("stat-raid").textContent = raid;
    document.getElementById("raid-slot-count").textContent = raid;
}

function updateBuffCoverage() {
    const raidBots = rosterData.filter(b => b.raid_assigned);
    const classesPresent = {};
    raidBots.forEach(b => {
        classesPresent[b.class] = (classesPresent[b.class] || 0) + 1;
    });

    const grid = document.getElementById("buff-grid");
    let html = "";
    const allClasses = ["Warrior", "Paladin", "Hunter", "Rogue", "Priest", "Shaman", "Mage", "Warlock", "Druid"];
    allClasses.forEach(cls => {
        const count = classesPresent[cls] || 0;
        const present = count > 0;
        html += `<span class="buff-tag ${present ? 'present' : 'missing'}">${cls}<span class="count">(${count})</span></span>`;
    });

    if (raidBots.length === 0) {
        html = '<span class="empty">No bots assigned to raid -- check some boxes below</span>';
    }
    grid.innerHTML = html;
}

function renderRoster() {
    const el = document.getElementById("roster-content");
    if (!rosterData || rosterData.length === 0) {
        el.innerHTML = '<div class="empty">No bots in roster</div>';
        return;
    }

    const grouped = { tank: [], healer: [], dps: [] };
    rosterData.forEach(b => {
        const role = grouped[b.role] ? b.role : "dps";
        grouped[role].push(b);
    });

    const roleLabels = { tank: "Tanks", healer: "Healers", dps: "DPS" };
    let html = '<table class="roster-table"><thead><tr>';
    html += '<th>Name</th><th>Class</th><th>Spec</th><th>Role</th>';
    html += '<th class="center">GS</th><th class="center">Raid</th>';
    html += '</tr></thead><tbody>';

    ["tank", "healer", "dps"].forEach(role => {
        const bots = grouped[role];
        if (bots.length === 0) return;
        html += `<tr class="role-header"><td colspan="6">${roleLabels[role]} (${bots.length})</td></tr>`;
        bots.forEach(b => {
            const specs = CLASS_SPECS[b.class] || [];
            const specOptions = specs.map(s =>
                `<option value="${s}" ${s === b.spec ? 'selected' : ''}>${s}</option>`
            ).join("");

            html += `<tr data-guid="${b.guid}">`;
            html += `<td><span class="bot-name" style="color: ${b.class_color}" onclick="toggleGear(${b.guid})">${b.name}</span></td>`;
            html += `<td style="color: ${b.class_color}">${b.class}</td>`;
            html += `<td><select class="spec-select" data-guid="${b.guid}" onchange="updateSpec(${b.guid}, this.value)">${specOptions}</select></td>`;
            html += `<td><select class="role-select" data-guid="${b.guid}" onchange="updateRole(${b.guid}, this.value)">
                        <option value="tank" ${b.role === 'tank' ? 'selected' : ''}>Tank</option>
                        <option value="healer" ${b.role === 'healer' ? 'selected' : ''}>Healer</option>
                        <option value="dps" ${b.role === 'dps' ? 'selected' : ''}>DPS</option>
                     </select></td>`;
            html += `<td class="center"><span class="gear-score ${gsClass(b.gear_score)}">${b.gear_score}</span></td>`;
            html += `<td class="center"><input type="checkbox" data-guid="${b.guid}" ${b.raid_assigned ? 'checked' : ''} onchange="toggleRaid(${b.guid}, this.checked)"></td>`;
            html += `</tr>`;
            html += `<tr class="gear-panel" id="gear-panel-${b.guid}"><td colspan="6"><div class="gear-detail" id="gear-detail-${b.guid}"><span class="gear-loading">Click to load gear...</span></div></td></tr>`;
        });
    });

    html += '</tbody></table>';
    el.innerHTML = html;
    updateSummary();
    updateBuffCoverage();
}

async function toggleGear(guid) {
    const panel = document.getElementById(`gear-panel-${guid}`);
    if (panel.classList.contains("open")) {
        panel.classList.remove("open");
        return;
    }
    panel.classList.add("open");

    const detail = document.getElementById(`gear-detail-${guid}`);

    if (gearCache[guid]) {
        renderGear(guid, gearCache[guid]);
        return;
    }

    detail.innerHTML = '<span class="gear-loading">Loading gear...</span>';
    const data = await fetchJSON(`/api/guild/bot/${guid}`);
    if (!data || data.error) {
        detail.innerHTML = '<span class="gear-loading">Failed to load gear</span>';
        return;
    }
    gearCache[guid] = data;
    renderGear(guid, data);
}

function renderGear(guid, data) {
    const detail = document.getElementById(`gear-detail-${guid}`);
    const gear = data.gear || [];
    if (gear.length === 0) {
        detail.innerHTML = '<span class="gear-loading">No gear equipped</span>';
        return;
    }
    let html = `<h4>${data.name} - Equipped Gear</h4><div class="gear-grid">`;
    gear.forEach(g => {
        html += `<div class="gear-slot">
            <span class="slot-name">${g.slot}</span>
            <span><span style="color: ${g.quality_color}">${g.name}</span><span class="item-level">iLvl ${g.item_level}</span></span>
        </div>`;
    });
    html += '</div>';
    detail.innerHTML = html;
}

async function updateSpec(guid, spec) {
    const resp = await fetch(`/api/guild/bot/${guid}/spec`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({spec: spec}),
    });
    if (resp.ok) {
        const bot = rosterData.find(b => b.guid === guid);
        if (bot) bot.spec = spec;
        delete gearCache[guid];
    }
}

async function updateRole(guid, role) {
    const resp = await fetch(`/api/guild/bot/${guid}/spec`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({role: role}),
    });
    if (resp.ok) {
        const bot = rosterData.find(b => b.guid === guid);
        if (bot) bot.role = role;
        // Re-render to move bot to correct role group
        renderRoster();
    }
}

function toggleRaid(guid, checked) {
    const bot = rosterData.find(b => b.guid === guid);
    if (bot) bot.raid_assigned = checked;
    dirty = true;
    document.getElementById("save-btn").disabled = false;
    updateSummary();
    updateBuffCoverage();
}

async function saveRaidPlan() {
    const btn = document.getElementById("save-btn");
    const status = document.getElementById("save-status");
    btn.disabled = true;
    status.textContent = "Saving...";
    status.className = "save-status";

    const assignments = rosterData.map(b => ({guid: b.guid, raid_assigned: b.raid_assigned}));
    try {
        const resp = await fetch("/api/guild/raid-plan", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({assignments: assignments}),
        });
        if (resp.ok) {
            status.textContent = "Saved!";
            status.className = "save-status success";
            dirty = false;
        } else {
            const data = await resp.json();
            status.textContent = "Error: " + (data.error || "Unknown");
            status.className = "save-status error";
            btn.disabled = false;
        }
    } catch (e) {
        status.textContent = "Network error";
        status.className = "save-status error";
        btn.disabled = false;
    }

    setTimeout(() => { status.textContent = ""; }, 3000);
}

async function loadRoster() {
    const data = await fetchJSON("/api/guild/roster");
    if (data && !data.error) {
        rosterData = data;
        renderRoster();
    } else {
        document.getElementById("roster-content").innerHTML =
            '<div class="empty">Failed to load roster' + (data && data.error ? ': ' + data.error : '') + '</div>';
    }
}

loadRoster();
</script>
</body>
</html>
