name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Three independent jobs so each can fail without masking the others.
#  - cpp-format: fast, runs on every PR
#  - python:     fast, runs on every PR
#  - cpp-build:  slow, runs only on main pushes (or when explicitly requested
#                via path filter changes). A full vmangos build takes too long
#                to gate every PR commit.
jobs:
  cpp-format:
    name: clang-format (vmangos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Run clang-format --dry-run -Werror on vmangos/src
        run: |
          set -euo pipefail
          # All committed C/C++ source under vmangos/src/, excluding vendored deps.
          files=$(git ls-files 'vmangos/src/**/*.cpp' 'vmangos/src/**/*.h' \
                                'vmangos/src/**/*.hpp' 'vmangos/src/**/*.cc' \
                                'vmangos/src/**/*.cxx' 'vmangos/src/**/*.hxx' || true)
          if [ -z "$files" ]; then
            echo "No C/C++ files found under vmangos/src/."
            exit 0
          fi
          echo "Checking $(echo "$files" | wc -l) files..."
          fail=0
          while IFS= read -r f; do
            if ! clang-format --dry-run -Werror --style=file "$f" 2>/dev/null; then
              echo "::error file=$f::clang-format would change this file"
              fail=1
            fi
          done <<< "$files"
          exit "$fail"

  python:
    name: ruff (dashboard + discord-bot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # Full C++ build. Slow — only runs on pushes to main, not on every PR commit.
  # If you want to run it ad-hoc, push to a branch and merge to main, or
  # temporarily relax the `if:` below in a PR that needs verification.
  cpp-build:
    name: cmake build (vmangos)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git \
            libssl-dev libmysqlclient-dev libcurl4-openssl-dev zlib1g-dev

      - name: Configure with CMake
        working-directory: vmangos
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: vmangos/build
        run: cmake --build . -j "$(nproc)"

  # Repo-wide gitleaks scan. Catches anything that slipped past the pre-commit
  # hook (or any commits authored without the hooks wired up).
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
